var TE_JSON=(function(){
  function collect(){var o={};var els=document.querySelectorAll('input[id],select[id],textarea[id]');for(var i=0;i<els.length;i++){var e=els[i];if(e.type==='file'||e.type==='button')continue;o[e.id]=(e.type==='checkbox'||e.type==='radio')?e.checked:e.value;}return o;}
  function applyOnce(o){Object.keys(o).forEach(function(id){var e=document.getElementById(id);if(!e)return;if(e.type==='checkbox'||e.type==='radio')e.checked=!!o[id];else e.value=o[id];});}
  function apply(o,after){applyOnce(o);try{if(after)after();}catch(e){}applyOnce(o);try{if(after)after();}catch(e){}} // late-fix pass: ช่องที่ถูกสร้างระหว่างคำนวณ
  function save(name,extra){var d={meta:{tool:name||document.title,exportedAt:new Date().toISOString(),schema:1},inputs:collect(),extra:extra||null};
    var b=new Blob([JSON.stringify(d,null,1)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(name||'tool')+'_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},2000);}
  function load(file,after,onExtra){if(!file)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(onExtra&&d.extra)onExtra(d.extra);apply(d.inputs||d,after);}catch(e){alert('ไฟล์ JSON ไม่ถูกต้อง: '+e.message);}};r.readAsText(file);}
  return{collect:collect,apply:apply,save:save,load:load};
})();

<script>
/* [แก้ไข 23 พ.ย. 2569] WP-30 Steam System Scoping v1.0.0
   - ข้อมูลคำถาม/ตัวเลือก/คะแนน อยู่ในบล็อก #ssst-data (ตรวจเทียบไฟล์ต้นฉบับ .xls ด้วย _wp30/check_data.py)

var QMAP={};QS.forEach(function(q){q.cat=SECMAP[q.sec].cat;q.max=q.type==='multi'?q.opts.reduce(function(a,o){return a+o.pts;},0):Math.max.apply(null,q.opts.map(function(o){return o.pts;}));QMAP[q.id]=q;});

function renderAll(){
  var snap=TE_JSON.collect();
  renderIntro();renderTabs();renderBasic();CATS.forEach(renderCat);renderFoot();
  Object.keys(snap).forEach(function(id){var e=G(id);if(!e)return;if(e.type==='checkbox'||e.type==='radio')e.checked=!!snap[id];else e.value=snap[id];});
  recalc();

/* ---------- คำนวณคะแนน (สายเดียว) ---------- */
var _res=null;
function qState(q){
  var r={id:q.id,max:q.max,score:0,answered:false,sel:[],none:false};
  if(q.type==='multi'){
    q.opts.forEach(function(o,i){var e=G('q_'+q.id+'_'+i);if(e&&e.checked){r.score+=o.pts;r.sel.push(i);}});
    var n=G('q_'+q.id+'_none');r.none=!!(n&&n.checked);r.answered=r.sel.length>0||r.none;
  }else{
    q.opts.forEach(function(o,i){var e=G('q_'+q.id+'_'+i);if(e&&e.checked){r.score=o.pts;r.sel=[i];r.answered=true;}});
  }
  r.lost=r.max-r.score;return r;
}
function recalc(){
  var R={q:{},cat:{},total:0,max:MAXTOT,answered:0};
  CATS.forEach(function(c){R.cat[c.id]={score:0,max:c.max,answered:0,n:0};});
  QS.forEach(function(q){var s=qState(q);R.q[q.id]=s;var cc=R.cat[q.cat];cc.score+=s.score;cc.n++;if(s.answered){cc.answered++;R.answered++;}R.total+=s.score;});
  R.pct=pct(R.total,R.max);_res=R;
  QS.forEach(function(q){var s=R.q[q.id],el=G('qsl_'+q.id);if(el)el.innerHTML=s.answered?(L('คะแนนข้อนี้','Score')+' <b>'+s.score+' / '+s.max+'</b>'):L('ยังไม่ตอบ','Not answered')+' · '+L('คะแนนเต็ม','max')+' '+s.max;
    var b=G('qbox_'+q.id);if(b)b.classList.toggle('ans',s.answered);});
  CATS.forEach(function(c){var t=G('tsc_'+c.id);if(t)t.textContent=R.cat[c.id].score+'/'+c.max;});
  G('hdrBadge').innerHTML=L('คะแนนรวม','Total score')+' <b id="hdr_total">'+R.total+'</b> / '+R.max+' · '+fmt1(R.pct)+'%';
  var ft=0,any=false;FUELS.forEach(function(f){var v=parseFloat(G(f[0])&&G(f[0]).value);if(isFinite(v)){ft+=v;any=true;}});
  var fe=G('fuelTot');if(fe)fe.innerHTML='<b>'+L('รวม','Total')+' '+(any?fmt1(ft):'0.0')+' %</b> '+(any&&Math.abs(ft-100)>0.05?'<span class="warnbox" style="display:inline-block;margin:0 0 0 6px">'+L('ผลรวมควรเท่ากับ 100%','Total should add up to 100%')+'</span>':'<span class="muted">'+L('(ผลรวมควรเท่ากับ 100%)','(should add up to 100%)')+'</span>');
  renderSummary(R);
  return R;
}
function ansText(q,s){
  if(!s.answered)return '<span class="muted">'+L('ยังไม่ตอบ','Not answered')+'</span>';
  if(q.type==='multi'){if(!s.sel.length)return esc(T(q.none));return s.sel.map(function(i){return esc(T(q.opts[i]));}).join('<br>');}
  return esc(T(q.opts[s.sel[0]]));
}
function bar(p,color){var w=Math.max(0,Math.min(100,p));return '<svg viewBox="0 0 100 10" preserveAspectRatio="none" role="img" aria-label="'+fmt1(p)+'%"><rect x="0" y="0" width="100" height="10" rx="2" fill="#e2e8f0"/><rect x="0" y="0" width="'+w.toFixed(2)+'" height="10" rx="2" fill="'+color+'"/></svg>';}
function barColor(p){return p>=75?'#1e9e5a':(p>=50?'#12a4a4':(p>=25?'#e08a00':'#d1495b'));}

    h+='<div class="barrow" id="bar_'+c.id+'"><div class="bl"><b>'+c.id+') '+esc(T(c))+'</b><span class="bv"><span id="cs_'+c.id+'">'+cc.score+'</span> / '+cc.max+' · <span id="cp_'+c.id+'">'+fmt1(p)+'</span>%</span></div>'+bar(p,barColor(p))+'</div>';});

  /* จุดที่ควรปรับปรุงก่อน */
  var lst=QS.map(function(q,i){return{q:q,s:R.q[q.id],i:i};}).filter(function(x){return x.s.lost>0;})
    .sort(function(a,b){return (b.s.lost-a.s.lost)||(b.q.max-a.q.max)||(a.i-b.i);});
  h+='<div class="card" id="prioCard"><h2>'+L('จุดที่ควรปรับปรุงก่อน','Where to improve first')+'</h2>'+
    '<p class="muted" style="font-size:.85rem">'+L('เรียงตามคะแนนที่เสียไปมากที่สุด (คะแนนเต็ม − คะแนนที่ได้) พร้อมสิ่งที่ควรทำตามต้นฉบับ และเครื่องมือฟรีที่ช่วยประเมินเชิงตัวเลขต่อ',
     'Sorted by points lost (maximum − your score), with the recommended action from the original and free tools for a quantitative follow-up.')+'</p>';
  if(!lst.length)h+='<div class="reco">'+L('ได้คะแนนเต็มทุกข้อ','Full score on every question.')+'</div>';
  lst.forEach(function(x,k){var q=x.q,s=x.s,sec=SECMAP[q.sec];
    var ln=(QLINKS[q.id]||[]).map(function(t){var o=TOOLS[t];return '<a href="'+o.f+'" target="_blank" rel="noopener">↗ '+esc(L(o.th,o.en))+'</a>';}).join('');
    h+='<div class="prio'+(k<5?' top':'')+'" data-q="'+q.id+'"><div class="ph"><span class="rk">'+(k+1)+'</span><span class="qid">'+q.id+'</span><b>'+esc(T(q.short))+'</b>'+
      '<span class="lost">'+L('เสีย','lost')+' <span class="pl">'+s.lost+'</span> / '+s.max+'</span></div>'+
      '<div class="pa">'+L('คำตอบ','Answer')+': '+ansText(q,s)+'</div>'+
      '<div class="pt"><b>'+L('ต้องทำอะไร','What To Do')+'</b> ('+esc(T(sec))+') — '+esc(T(sec.todo))+'</div>'+
      (ln?'<div class="links">'+ln+'</div>':'')+'</div>';});
  h+='</div>';
  /* ตารางรายข้อ */
  h+='<div class="card" id="qtabCard"><h2>'+L('คะแนนรายข้อ','Score by question')+'</h2><div class="scroll-x"><table id="qtab"><thead><tr><th>'+L('ข้อ','No.')+'</th><th>'+L('หัวข้อ','Question')+'</th><th>'+L('คำตอบ','Answer')+'</th><th class="num">'+L('ได้','Score')+'</th><th class="num">'+L('เต็ม','Max')+'</th></tr></thead><tbody>';
  CATS.forEach(function(c){var cc=R.cat[c.id];
    h+='<tr class="catrow"><td colspan="3">'+c.id+') '+esc(T(c))+'</td><td class="num">'+cc.score+'</td><td class="num">'+cc.max+'</td></tr>';
    QS.filter(function(q){return q.cat===c.id;}).forEach(function(q){var s=R.q[q.id];
      h+='<tr><td class="qcell">'+q.id+'</td><td>'+esc(T(q.short))+'</td><td style="font-size:.82rem">'+ansText(q,s)+'</td><td class="num" id="qs_'+q.id+'">'+s.score+'</td><td class="num">'+s.max+'</td></tr>';});
  });
  h+='<tr class="totrow"><td colspan="3">'+L('คะแนนรวมทั้งหมด','Total scoping tool questionnaire score')+'</td><td class="num">'+R.total+'</td><td class="num">'+R.max+'</td></tr></tbody></table></div></div>';
  h+='<div class="card" id="basicSumCard"><h2>'+L('ข้อมูลพื้นฐาน (ไม่คิดคะแนน)','Basic data (not scored)')+'</h2>'+basicSummary()+'</div>';
  /* ขั้นต่อไป — แผ่น 8 */
  h+='<div class="card" id="nextCard"><h2>'+L('ขั้นต่อไป: แหล่งข้อมูลเพิ่มเติมของ DOE','Next steps: additional DOE BestPractices Steam resources')+'</h2>'+
    '<p style="font-size:.88rem">'+L('ต้นฉบับแนะนำเอกสารต่อไปนี้ของโครงการ DOE BestPractices Steam (ค้นตามชื่อเอกสาร): Steam System Survey Guide (คู่มืออ้างอิงเชิงเทคนิคสำหรับประเมินโอกาสปรับปรุงเชิงปริมาณ) · Improving Steam System Performance: A Sourcebook for Industry · โปรแกรมประเมินฉนวน 3E-Plus · และเอกสาร Steam Tip Sheets ตามหัวข้อด้านล่าง',
      'The original points to these DOE BestPractices Steam resources (search by title): Steam System Survey Guide (a technical reference for quantifying improvement opportunities) · Improving Steam System Performance: A Sourcebook for Industry · 3E-Plus insulation appraisal software · and the Steam Tip Sheets listed below.')+'</p>';
  D.tips.forEach(function(t){var c=CATS[t.cat-1];h+='<h3>'+c.id+') '+esc(T(c))+'</h3><ul style="margin:.2rem 0 .4rem 1.1rem;padding:0;font-size:.88rem">'+t.items.map(function(i){return '<li>'+esc(T(i))+'</li>';}).join('')+'</ul>';});
  h+='</div>';
  G('pane-sum').innerHTML=h;
  var nm=G('p_name'),dt=G('p_date');
  G('prHead').innerHTML='<b>'+L('รายงานประเมินตนเองระบบไอน้ำ','Steam System Self-Assessment Report')+'</b>'+(nm&&nm.value?' — '+esc(nm.value):'')+(dt&&dt.value?' · '+esc(dt.value):'');
}

/* ---------- เหตุการณ์ ---------- */
var DIRTY=false;
document.addEventListener('change',function(ev){
  var t=ev.target;if(!t||!t.id)return;
  if(t.type==='checkbox'&&t.dataset.q){
    var q=QMAP[t.dataset.q];
    if(t.dataset.none==='1'&&t.checked){q.opts.forEach(function(o,i){var e=G('q_'+q.id+'_'+i);if(e)e.checked=false;});}
    else if(t.checked){var n=G('q_'+q.id+'_none');if(n)n.checked=false;}
  }
  if(t.id!=='fileLoad')DIRTY=true;
  recalc();
});
document.addEventListener('input',function(ev){var t=ev.target;if(t&&t.id&&(t.type==='number'||t.type==='text'||t.tagName==='TEXTAREA')){DIRTY=true;recalc();}});
window.addEventListener('beforeunload',function(e){if(DIRTY){e.preventDefault();e.returnValue=L('ข้อมูลที่กรอกจะหาย — บันทึก JSON ก่อนออก','Entered data will be lost — save JSON before leaving');return e.returnValue;}});
/* ค่าตัวอย่างข้อความ (ข้อมูลสมมุติ) — สลับตามภาษาเมื่อผู้ใช้ยังไม่ได้แก้ค่า */
var EXV=[['p_name','โรงงานตัวอย่าง (สมมุติ)','Example plant (fictitious)'],
  ['b_desc','โรงงานแปรรูปอาหาร ใช้ไอน้ำในการต้มและฆ่าเชื้อ (ข้อมูลสมมุติ)','Food processing plant using steam for cooking and sterilising (fictitious data)']];
function exVal(id){for(var i=0;i<EXV.length;i++)if(EXV[i][0]===id)return LG()==='en'?EXV[i][2]:EXV[i][1];return '';}
function swapExampleVals(){EXV.forEach(function(x){var e=G(x[0]);if(e&&(e.value===x[1]||e.value===x[2]))e.value=LG()==='en'?x[2]:x[1];});}
document.addEventListener('te-lang',function(){swapExampleVals();renderAll();});

function clearAll(skipConfirm){
  if(!skipConfirm&&_res&&_res.answered>0&&!confirm(L('ล้างคำตอบทั้งหมด?','Clear all answers?')))return;
  [].forEach.call(document.querySelectorAll('input[data-q]'),function(e){e.checked=false;});
  recalc();
}
function fillExample(){
  if(_res&&_res.answered>0&&!confirm(L('แทนที่คำตอบปัจจุบันด้วยตัวอย่าง?','Replace current answers with the example?')))return;
  /* ข้อมูลสมมุติ — ไม่ใช่โรงงานจริง */
  var B={p_name:exVal('p_name'),b_desc:exVal('b_desc'),
    b_steam_yr:'48000',b_hours:'6000',b_cap_t:'15',b_avg_t:'8',b_f_coal:'60',b_f_bio:'40',b_traps:'180',b_bd:'5'};
  Object.keys(B).forEach(function(k){if(G(k))G(k).value=B[k];});
  var A={SC1:0,SC2:1,BM1:0,BM2:2,MS1:[0,1],MS2:3,ST1:[0,3],WT1:0,WT2:1,WT3:1,IN1:1,IN2:1,LK1:2,WH1:1,MN1:[0,1],BE1:1,BE2:[0],BE3:1,HR1:[0],DS1:2,GB1:1,GB2:0,GB3:1,PR1:2,CR1:2,FS1:3};
  [].forEach.call(document.querySelectorAll('input[data-q]'),function(e){e.checked=false;});
  Object.keys(A).forEach(function(k){var v=A[k];(Array.isArray(v)?v:[v]).forEach(function(i){var e=G('q_'+k+'_'+i);if(e)e.checked=true;});});
  DIRTY=true;recalc();
}
function teSaveJSON(){recalc();TE_JSON.save('Tool_Steam_System_Scoping',{tool:'Steam System Scoping',version:TOOL_VER,total:_res.total,max:_res.max});DIRTY=false;try{if(window.TE_INSIGHT)TE_INSIGHT.track('save','json');}catch(e){}}
function teLoadJSON(file){TE_JSON.load(file,function(){swapExampleVals();recalc();DIRTY=false;});}
function tePrint(){recalc();try{if(window.TE_INSIGHT)TE_INSIGHT.track('print','report');}catch(e){}window.print();}
window.addEventListener('beforeprint',function(){recalc();});
function ensureAllCalc(){return recalc();}
var recalcAll=ensureAllCalc;

if(window.TE_I18N){
  TE_I18N.set({
   "Steam System Scoping — ประเมินตนเองระบบไอน้ำ":"Steam System Scoping — Steam System Self-Assessment",
   "💾 บันทึก JSON":"💾 Save JSON","📂 โหลด JSON":"📂 Load JSON","🖨 พิมพ์รายงาน":"🖨 Print report",
   "ไฟล์ JSON ไม่ถูกต้อง:":"Invalid JSON file:"
  },[[/^ไฟล์ JSON ไม่ถูกต้อง: /,'Invalid JSON file: ']]);
}
renderAll();
</script>
