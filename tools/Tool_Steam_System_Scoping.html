"todo": {
"en": "Identify key steam operational parameters that you should monitor and ensure that you are adequately measuring them.",
"th": "ระบุตัวแปรการทำงานหลักของระบบไอน้ำที่ควรติดตาม และตรวจว่ามีการวัดอย่างเพียงพอ"
},
"why": {
"en": "You Can't Manage What You Don't Measure! Measurement of key steam system parameters assists you in monitoring your system, diagnosing potential system problems, and ensuring that system improvements continue to provide benefits to your operations.",
"th": "สิ่งที่ไม่ได้วัดย่อมจัดการไม่ได้ การวัดตัวแปรหลักของระบบไอน้ำช่วยติดตามการทำงาน วินิจฉัยปัญหาที่อาจเกิด และยืนยันว่าผลของการปรับปรุงยังคงอยู่"
}
},
{
"id": "ST",
"cat": 2,
"en": "Steam Trap Maintenance",
"th": "การบำรุงรักษากับดักไอน้ำ",
"todo": {
"en": "Implement a comprehensive program to correctly select, test, and maintain your steam traps.",
"th": "จัดทำแผนงานที่ครอบคลุมการเลือก การทดสอบ และการบำรุงรักษากับดักไอน้ำอย่างถูกต้อง"
},
"why": {
"en": "Steam traps play three important functions: a) prevent steam from escaping from the system before the heat is utilized; b) remove condensate from the system; and c) vent noncondensable gases. Poor steam trap selection, testing, and maintenance can result in many system problems including water hammer, ineffective process heat transfer, steam leakage, and system corrosion. An effective steam trap selection and maintenance program is often an excellent investment with paybacks of less than half a year.",
"th": "กับดักไอน้ำมีหน้าที่สำคัญสามอย่าง คือ ก) กันไอน้ำหลุดออกจากระบบก่อนนำความร้อนไปใช้ ข) ระบายคอนเดนเสทออกจากระบบ และ ค) ระบายก๊าซที่ไม่ควบแน่น การเลือก ทดสอบ และบำรุงรักษาที่ไม่ดีก่อปัญหาหลายอย่าง เช่น Water Hammer การถ่ายเทความร้อนในกระบวนการไม่ดี ไอน้ำรั่ว และการกัดกร่อน แผนงานกับดักไอน้ำที่ได้ผลมักเป็นการลงทุนที่คืนทุนภายในไม่ถึงครึ่งปี"
}
},
{
"id": "WT",
"cat": 2,
"en": "Water Treatment Program",
"th": "แผนงานปรับสภาพน้ำ",
"todo": {
"en": "Implement and maintain an effective Water Treatment Program in your steam system.",
"th": "จัดทำและรักษาแผนงานปรับสภาพน้ำที่ได้ผลในระบบไอน้ำ"
},
"why": {
"en": "An effective steam system Water Treatment Program: a) reduces the potential for waterside fouling problems in your boilers; b) is critical to minimizing boiler blowdown and the resulting energy losses; c) can reduce the generation of wet steam; and d) greatly reduces the potential for corrosion problems throughout your steam system. Most effective water treatment programs include both mechanical (filtration, softening, and deaeration) and chemical treatment. Problems in this area can lead to significant plant productivity issues related to equipment failure and downtime - be sure to consult with a chemical treatment specialist on an ongoing basis.",
"th": "แผนงานปรับสภาพน้ำที่ได้ผล ก) ลดโอกาสเกิดตะกรันด้านน้ำในหม้อไอน้ำ ข) เป็นหัวใจของการลดโบลว์ดาวน์และพลังงานที่สูญเสียไปกับโบลว์ดาวน์ ค) ลดการเกิดไอน้ำเปียก และ ง) ลดโอกาสการกัดกร่อนทั่วทั้งระบบไอน้ำ แผนงานที่ได้ผลส่วนใหญ่มีทั้งการปรับสภาพเชิงกล (กรอง ทำน้ำอ่อน ไล่อากาศ) และทางเคมี ปัญหาด้านนี้ทำให้อุปกรณ์เสียหายและต้องหยุดเครื่อง กระทบผลิตภาพมาก ควรปรึกษาผู้เชี่ยวชาญด้านเคมีปรับสภาพน้ำอย่างต่อเนื่อง"
}
},
{
"id": "IN",
"cat": 2,
"en": "System Insulation",
"th": "ฉนวนในระบบไอน้ำ",
"todo": {
"en": "Ensure that the appropriate major components of your steam system are well insulated. Determine the economic insulation thickness for your system components, and perform system insulation reviews to identify exposed surfaces that should be insulated and/or unrestored or damaged insulation.",
"th": "ดูแลให้อุปกรณ์หลักในระบบไอน้ำหุ้มฉนวนอย่างดี หาความหนาฉนวนที่คุ้มค่าทางเศรษฐศาสตร์ และสำรวจฉนวนเป็นระยะเพื่อหาผิวที่ควรหุ้มแต่ยังไม่หุ้ม หรือฉนวนที่ชำรุดและยังไม่ได้ซ่อม"
},
"why": {
"en": "Effective insulation - on piping, valves, fittings, and vessels - serves many important purposes. Insulation keeps steam energy within the system to be effectively used by processes, it can reduce temperature fluctuations in the system, it can reduce space conditioning requirements, and it can reduce the potential for personnel burns.",
"th": "ฉนวนที่ดีบนท่อ วาล์ว ข้อต่อ และถัง มีประโยชน์หลายด้าน คือ เก็บพลังงานไอน้ำไว้ในระบบเพื่อใช้ในกระบวนการ ลดความผันผวนของอุณหภูมิในระบบ ลดภาระการปรับอากาศในพื้นที่ และลดโอกาสที่พนักงานจะถูกความร้อนลวก"
}
},
{
"id": "LK",
"cat": 2,
"en": "Steam Leaks",
"th": "ไอน้ำรั่ว",
"todo": {
"en": "Identify and quickly repair steam leaks in your steam system.",
"th": "ตรวจหาและซ่อมจุดไอน้ำรั่วในระบบโดยเร็ว"
},
"why": {
"en": "Steam leaks can result from failures associated with such things as improper piping design, corrosion problems, and joint and valve seal failures. In high-pressure industrial steam systems, energy costs associated with steam leaks can be substantial. Identifying and repairing steam leaks is essential to properly balancing your steam system.",
"th": "ไอน้ำรั่วเกิดได้จากการออกแบบท่อไม่เหมาะสม การกัดกร่อน และซีลข้อต่อหรือวาล์วเสีย ในระบบไอน้ำอุตสาหกรรมความดันสูง ต้นทุนพลังงานจากไอน้ำรั่วอาจสูงมาก การตรวจหาและซ่อมจุดรั่วจึงจำเป็นต่อการปรับสมดุลระบบไอน้ำ"
}
},
{
"id": "WH",
"cat": 2,
"en": "Water Hammer",
"th": "Water Hammer (ค้อนน้ำ)",
"todo": {
"en": "Detect and quickly eliminate Water Hammer in your steam system.",
"th": "ตรวจหาและขจัด Water Hammer ในระบบไอน้ำโดยเร็ว"
},
"why": {
"en": "Water Hammer is a serious concern - it can lead to failure and rupture of piping and valves, and in many cases significant personnel injury due to contact with steam and condensate. There are two main types of water hammer: one caused by accumulation of condensate in steam distribution piping and transport of this condensate by high-velocity steam; and the other caused by a pressure pulse resulting from steam collapse (rapid condensation) in condensate return lines and heat exchange equipment. Water Hammer in your steam system always says FIX ME!!",
"th": "Water Hammer เป็นเรื่องร้ายแรง ทำให้ท่อและวาล์วเสียหายหรือแตก และหลายกรณีทำให้พนักงานบาดเจ็บสาหัสจากไอน้ำและคอนเดนเสท มีสองแบบหลัก คือ แบบที่คอนเดนเสทสะสมในท่อจ่ายไอน้ำแล้วถูกไอน้ำความเร็วสูงพัดไป และแบบที่เกิดคลื่นความดันจากไอน้ำยุบตัว (ควบแน่นฉับพลัน) ในท่อคอนเดนเสทกลับและอุปกรณ์แลกเปลี่ยนความร้อน เมื่อพบ Water Hammer ต้องแก้ไขเสมอ"
}
},
{
"id": "MN",
"cat": 2,
"en": "Maintaining Effective Steam System Operations",
"th": "การบำรุงรักษาให้ระบบไอน้ำทำงานได้ผล",
"todo": {
"en": "Establish and carry out a comprehensive steam system maintenance program.",
"th": "จัดทำและดำเนินแผนบำรุงรักษาระบบไอน้ำอย่างครบถ้วน"
},
"why": {
"en": "Effective steam system operating practices and improvements can provide benefits to your steam operations year after year - IF you have an effective system maintenance program in place. Major areas of maintenance that will provide year-after-year benefits to your operations include: a) steam traps; b) boiler performance; c) water treatment; d) turbines, piping, heat exchangers, pumps, motors, and valves; and e) system insulation.",
"th": "แนวปฏิบัติและการปรับปรุงที่ดีให้ประโยชน์ต่อเนื่องทุกปี หากมีแผนบำรุงรักษาที่ได้ผลรองรับ งานบำรุงรักษาหลักที่ให้ผลระยะยาว ได้แก่ ก) กับดักไอน้ำ ข) สมรรถนะหม้อไอน้ำ ค) การปรับสภาพน้ำ ง) กังหัน ท่อ อุปกรณ์แลกเปลี่ยนความร้อน ปั๊ม มอเตอร์ และวาล์ว และ จ) ฉนวนในระบบ"
}
},
{
"id": "BE",
"cat": 3,
"en": "Boiler Efficiency",
"th": "ประสิทธิภาพหม้อไอน้ำ",
"todo": {
"en": "Measure, trend, and look for opportunities to improve the efficiency of your boilers.",
"th": "วัด ติดตามแนวโน้ม และหาโอกาสปรับปรุงประสิทธิภาพหม้อไอน้ำ"
},
"why": {
"en": "One of the key boiler plant functions is to generate steam at the highest possible efficiency. Major sources of boiler efficiency losses include: a) combustion and flue gas energy losses [typically the largest]; b) blowdown losses; and c) refractory insulation losses. It is important to measure and trend boiler efficiency, flue gas temperature, flue gas oxygen content, and flue gas carbon monoxide content on a regular basis. Measurement and control of excess oxygen is critical to minimizing boiler combustion energy losses. Trending flue gas temperature can provide indications of other potential boiler problems, such as waterside or fireside fouling problems.",
"th": "หน้าที่หลักของโรงผลิตไอน้ำคือผลิตไอน้ำที่ประสิทธิภาพสูงที่สุด แหล่งสูญเสียหลัก ได้แก่ ก) การเผาไหม้และพลังงานในก๊าซไอเสีย (มักมากที่สุด) ข) โบลว์ดาวน์ และ ค) ผนังและฉนวนวัสดุทนไฟ ควรวัดและติดตามแนวโน้มประสิทธิภาพหม้อไอน้ำ อุณหภูมิ ออกซิเจน และคาร์บอนมอนอกไซด์ในก๊าซไอเสียสม่ำเสมอ การวัดและควบคุมออกซิเจนส่วนเกินสำคัญมากต่อการลดความสูญเสียจากการเผาไหม้ แนวโน้มอุณหภูมิก๊าซไอเสียยังบอกปัญหาอื่นได้ เช่น ตะกรันด้านน้ำหรือคราบด้านไฟ"
}
},
{
"id": "HR",
"cat": 3,
"en": "Heat Recovery Equipment",
"th": "อุปกรณ์นำความร้อนกลับมาใช้",
"todo": {
"en": "Evaluate installation of Heat Recovery Equipment on your Boiler Plant.",
"th": "ประเมินการติดตั้งอุปกรณ์นำความร้อนกลับมาใช้ในโรงผลิตไอน้ำ"
},
"why": {
"en": "In some boilers, high flue gas temperatures and high continuous blowdown rates can provide opportunities for installation of heat recovery equipment. Feedwater economizers and combustion air preheaters can, under appropriate conditions, be installed to extract excess flue gas energy and effectively increase the boiler efficiency. Blowdown heat recovery equipment can also, for some systems, be installed to extract otherwise lost heat from the blowdown system. For either potential opportunity, an economic analysis is needed to determine the feasibility of the opportunity, and the equipment should be designed and installed by qualified professionals.",
"th": "หม้อไอน้ำบางเครื่องมีอุณหภูมิก๊าซไอเสียสูงและโบลว์ดาวน์ต่อเนื่องสูง จึงมีโอกาสติดตั้งอุปกรณ์นำความร้อนกลับ อีโคโนไมเซอร์อุ่นน้ำป้อนและเครื่องอุ่นอากาศเผาไหม้ช่วยดึงพลังงานส่วนเกินจากก๊าซไอเสียและเพิ่มประสิทธิภาพหม้อไอน้ำได้เมื่อเงื่อนไขเหมาะสม บางระบบติดตั้งอุปกรณ์นำความร้อนจากโบลว์ดาวน์กลับมาใช้ได้ด้วย ทั้งสองทางต้องวิเคราะห์ความคุ้มค่าก่อน และให้ผู้เชี่ยวชาญที่มีคุณสมบัติเหมาะสมออกแบบและติดตั้ง"
}
},
{
"id": "DS",
"cat": 3,
"en": "Generating Dry Steam",
"th": "การผลิตไอน้ำแห้ง",
"todo": {
"en": "Ensure that you generate high-quality dry steam in your boiler plant.",
"th": "ดูแลให้โรงผลิตไอน้ำผลิตไอน้ำแห้งคุณภาพสูง"
},
"why": {
"en": "Steam of 100% quality contains no liquid water; wet steam contains liquid droplets. Generating wet steam in your boiler can cause many system problems, including: a) inefficient process heat transfer; b) equipment failure by water hammer; c) equipment failure by corrosion and erosion; and d) steam trap failure by overloading. Some typical causes for creation of wet steam and boiler carryover are: a) wide swings in boiler water level; b) reduced operating pressure; c) boiler overload; and d) poor boiler total dissolved solids (TDS) control. A critical step to ensuring generation of high-quality steam is to measure the quality of steam leaving your boiler; this is typically done using steam calorimeters.",
"th": "ไอน้ำคุณภาพ 100% ไม่มีน้ำปน ส่วนไอน้ำเปียกมีหยดน้ำปน ไอน้ำเปียกก่อปัญหาหลายอย่าง ได้แก่ ก) การถ่ายเทความร้อนในกระบวนการไม่ดี ข) อุปกรณ์เสียหายจาก Water Hammer ค) อุปกรณ์เสียหายจากการกัดกร่อนและสึกกร่อน และ ง) กับดักไอน้ำเสียเพราะรับภาระเกิน สาเหตุที่พบบ่อยของไอน้ำเปียกและน้ำพาออกจากหม้อไอน้ำ (carryover) คือ ก) ระดับน้ำในหม้อไอน้ำแกว่งมาก ข) เดินที่ความดันต่ำกว่าปกติ ค) หม้อไอน้ำรับภาระเกิน และ ง) ควบคุมของแข็งละลายทั้งหมด (TDS) ไม่ดี ขั้นสำคัญคือวัดคุณภาพไอน้ำที่ออกจากหม้อไอน้ำ ซึ่งมักใช้แคลอริมิเตอร์ไอน้ำ"
}
},
{
"id": "GB",
"cat": 3,
"en": "General Boiler Operation",
"th": "การเดินหม้อไอน้ำทั่วไป",
"todo": {
"en": "Ensure that your boilers perform their functions without large fluctuations in operating conditions.",
"th": "ดูแลให้หม้อไอน้ำทำงานโดยสภาวะการทำงานไม่แกว่งมาก"
},
"why": {
"en": "How you control boiler operation can effect many elements of the steam system - including the operating life of the boiler, the quality of steam produced, and the effectiveness of steam use throughout your production operations.",
"th": "วิธีควบคุมการเดินหม้อไอน้ำส่งผลต่อหลายส่วนของระบบไอน้ำ รวมถึงอายุการใช้งานหม้อไอน้ำ คุณภาพไอน้ำที่ผลิต และประสิทธิผลของการใช้ไอน้ำทั่วทั้งการผลิต"
}
},
{
"id": "PR",
"cat": 4,
"en": "Options For Reducing Steam Pressure - Minimize Steam Flow Through PRVs",
"th": "ทางเลือกในการลดความดันไอน้ำ – ลดการไหลของไอน้ำผ่าน PRV",
"todo": {
"en": "Investigate potential to use backpressure turbines in parallel with pressure reducing valves in your steam system.",
"th": "ศึกษาศักยภาพการใช้กังหันไอน้ำแบบแบ็กเพรสเชอร์ติดตั้งขนานกับวาล์วลดความดัน (PRV) ในระบบไอน้ำ"
},
"why": {
"en": "In many steam systems, pressure reducing valves (PRVs) are used to provide steam at pressures lower than generated from the boiler. A potential opportunity for improving a steam system is to minimize the flow of steam through PRVs. One opportunity for doing this is to install backpressure turbines in parallel with PRVs in your steam system; in this way you can provide the low-pressure steam required and generate electricity or shaft power that can be utilized. A detailed economic analysis must be performed to evaluate this type of opportunity.",
"th": "ระบบไอน้ำจำนวนมากใช้วาล์วลดความดัน (PRV) เพื่อจ่ายไอน้ำที่ความดันต่ำกว่าที่หม้อไอน้ำผลิต โอกาสปรับปรุงคือลดปริมาณไอน้ำที่ไหลผ่าน PRV วิธีหนึ่งคือติดตั้งกังหันไอน้ำแบบแบ็กเพรสเชอร์ขนานกับ PRV ซึ่งจ่ายไอน้ำความดันต่ำได้ตามต้องการ และได้ไฟฟ้าหรือกำลังเพลาไปใช้งาน โอกาสแบบนี้ต้องวิเคราะห์เศรษฐศาสตร์อย่างละเอียด"
}
},
{
"id": "CR",
"cat": 4,
"en": "Recover And Utilize Available Condensate",
"th": "การนำคอนเดนเสทกลับมาใช้",
"todo": {
"en": "Determine how much of your available condensate you recover and utilize.",
"th": "หาว่าคอนเดนเสทที่มีอยู่ถูกนำกลับมาใช้ได้มากเพียงใด"
},
"why": {
"en": "Returning a substantial portion of your condensate to your boiler can have both energy and chemical treatment benefits: a) condensate is hotter than makeup water, so less energy is required to convert condensate to steam; and b) condensate requires significantly less chemical treatment than makeup water, so there may be savings in chemical treatment costs associated with returning condensate. Returning as much condensate as possible also can help to reduce boiler blowdown (because fewer impurities are resident in condensate), and so minimize blowdown energy losses.",
"th": "การส่งคอนเดนเสทกลับหม้อไอน้ำให้ได้มากให้ประโยชน์ทั้งด้านพลังงานและการปรับสภาพน้ำ คือ ก) คอนเดนเสทร้อนกว่าน้ำเติม จึงใช้พลังงานน้อยกว่าในการทำเป็นไอน้ำ และ ข) คอนเดนเสทต้องปรับสภาพด้วยสารเคมีน้อยกว่าน้ำเติมมาก จึงอาจประหยัดค่าสารเคมี การนำกลับให้มากที่สุดยังช่วยลดโบลว์ดาวน์ (เพราะคอนเดนเสทมีสิ่งเจือปนน้อย) และลดพลังงานที่สูญเสียกับโบลว์ดาวน์"

function LG(){return (window.TE_I18N&&TE_I18N.lang==='en')?'en':'th';}
function L(th,en){return LG()==='en'?en:th;}
function T(o){return o?(LG()==='en'?o.en:o.th):'';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function G(id){return document.getElementById(id);}
function fmt1(x){return (Math.round(x*10)/10).toFixed(1);}
function pct(s,m){return m>0?s/m*100:0;}

var CUR_TAB='basic';
function markTab(){[].forEach.call(document.querySelectorAll('.tab'),function(t){t.classList.toggle('active',t.getAttribute('data-tab')===CUR_TAB);});

function fld(id,th,en,unit,hintTh,hintEn,kind,type){
  /* [แก้ไข 25 พ.ย. 2569] #516 เพิ่มชนิดป้าย plant = ข้อมูลโรงงาน (EN plant data) ใช้กับช่องสัดส่วนเชื้อเพลิง ข้อ f */
  var chip=kind?'<span class="fchip '+kind+'">'+({design:L('ออกแบบ','Design'),meas:L('วัดจริง','Measured'),set:L('ตั้งค่า','Setting'),calc:L('คำนวณ','Calculated'),plant:L('ข้อมูลโรงงาน','Plant data')}[kind])+'</span>':'';
  var inp=type==='textarea'?'<textarea id="'+id+'"></textarea>':'<input type="'+(type||'number')+'" id="'+id+'"'+(type?'':' min="0" step="any" inputmode="decimal"')+'>';
  return '<div><label class="fl" for="'+id+'">'+th+(en?'':'')+(unit?' <span class="unit">'+unit+'</span>':'')+chip+'</label>'+inp+(hintTh?'<div class="hint">'+L(hintTh,hintEn)+'</div>':'')+'</div>';
}

function renderAll(){

/* ---------- คำนวณคะแนน (สายเดียว) ---------- */
var _res=null;
function qState(q){
  var r={id:q.id,max:q.max,score:0,answered:false,sel:[],none:false};
  if(q.type==='multi'){
    q.opts.forEach(function(o,i){var e=G('q_'+q.id+'_'+i);if(e&&e.checked){r.score+=o.pts;r.sel.push(i);}});
    var n=G('q_'+q.id+'_none');r.none=!!(n&&n.checked);r.answered=r.sel.length>0||r.none;
  }else{
    q.opts.forEach(function(o,i){var e=G('q_'+q.id+'_'+i);if(e&&e.checked){r.score=o.pts;r.sel=[i];r.answered=true;}});
  }
  r.lost=r.max-r.score;return r;
}
function recalc(){
  var R={q:{},cat:{},total:0,max:MAXTOT,answered:0};
  CATS.forEach(function(c){R.cat[c.id]={score:0,max:c.max,answered:0,n:0};});
  QS.forEach(function(q){var s=qState(q);R.q[q.id]=s;var cc=R.cat[q.cat];cc.score+=s.score;cc.n++;if(s.answered){cc.answered++;R.answered++;}R.total+=s.score;});
  R.pct=pct(R.total,R.max);_res=R;
  QS.forEach(function(q){var s=R.q[q.id],el=G('qsl_'+q.id);if(el)el.innerHTML=s.answered?(L('คะแนนข้อนี้','Score')+' <b>'+s.score+' / '+s.max+'</b>'):L('ยังไม่ตอบ','Not answered')+' · '+L('คะแนนเต็ม','max')+' '+s.max;
    var b=G('qbox_'+q.id);if(b)b.classList.toggle('ans',s.answered);});
  CATS.forEach(function(c){var t=G('tsc_'+c.id);if(t)t.textContent=R.cat[c.id].score+'/'+c.max;});
  G('hdrBadge').innerHTML=L('คะแนนรวม','Total score')+' <b id="hdr_total">'+R.total+'</b> / '+R.max+' · '+fmt1(R.pct)+'%';
  var ft=0,any=false;FUELS.forEach(function(f){var v=parseFloat(G(f[0])&&G(f[0]).value);if(isFinite(v)){ft+=v;any=true;}});
  var fe=G('fuelTot');if(fe)fe.innerHTML='<b>'+L('รวม','Total')+' '+(any?fmt1(ft):'0.0')+' %</b> '+(any&&Math.abs(ft-100)>0.05?'<span class="warnbox" style="display:inline-block;margin:0 0 0 6px">'+L('ผลรวมควรเท่ากับ 100% — ตรวจสัดส่วนเชื้อเพลิงอีกครั้ง (ไม่มีผลต่อคะแนน)','Total should add up to 100% — please check the fuel shares (does not affect the score)')+'</span>':'<span class="muted">'+L('(ผลรวมควรเท่ากับ 100%)','(should add up to 100%)')+'</span>');
  renderSummary(R);
  return R;
}
function ansText(q,s){
  if(!s.answered)return '<span class="muted">'+L('ยังไม่ตอบ','Not answered')+'</span>';
  if(q.type==='multi'){if(!s.sel.length)return esc(T(q.none));return s.sel.map(function(i){return esc(T(q.opts[i]));}).join('<br>');}
  return esc(T(q.opts[s.sel[0]]));
}
