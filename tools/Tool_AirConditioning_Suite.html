<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Air Conditioning Suite — Triple E Technology</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
:root{--n:#0f2a4a;--t:#1f618d}
body{margin:0;font:15px/1.6 'IBM Plex Sans Thai',sans-serif;background:#eef2f6;color:#1c2733;display:flex;flex-direction:column;min-height:100vh}
header{background:linear-gradient(115deg,var(--n),#1f618d 130%);color:#fff;padding:12px 18px}
header .in{max-width:1280px;margin:0 auto;display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
h1{font:700 1.45em 'Barlow Condensed',sans-serif;margin:0;letter-spacing:.3px}
.sub{opacity:.85;font-size:.85em}
.segwrap{margin-left:auto;display:flex;background:rgba(255,255,255,.14);border-radius:11px;padding:4px;gap:4px;flex-wrap:wrap}
.seg{font:600 .95em 'IBM Plex Sans Thai',sans-serif;border:none;border-radius:8px;background:transparent;color:#eaf2f8;padding:7px 16px;cursor:pointer}
.seg.on{background:#fff;color:var(--n)}
.note{max-width:1280px;margin:8px auto 0;padding:0 18px;font-size:.82em;color:#5b6b7b}
.frame{flex:1;display:flex;max-width:1280px;width:100%;margin:6px auto 14px;padding:0 18px;box-sizing:border-box}
iframe{flex:1;border:1px solid #d7e0e8;border-radius:12px;background:#fff;min-height:calc(100vh - 150px)}
a.back{color:#cfe4f0;text-decoration:none;font-size:.85em}
</style>
</head>
<body>
<header><div class="in"><a class="back" href="../index.html">← เครื่องมือทั้งหมด</a><h1>❄️ Air Conditioning Suite</h1><span class="sub">เครื่องปรับอากาศครบชุด — Chiller · Split Type · VRV/VRF</span>
<nav class="segwrap" id="segs"><button class="seg on" data-src="Tool_AirCon_Audit.html">🏢 ระบบรวม / Chiller</button><button class="seg" data-src="Tool_SplitAC_Calculator.html">🧊 Split Type</button><button class="seg" data-src="Tool_VRV_VRF_Calculator.html">🌐 VRV / VRF</button></nav></div></header>
<div class="note">💡 เลือกชนิดระบบปรับอากาศจากปุ่มมุมขวาบน — ระบบรวม/Chiller (ตรวจวัดทั้งอาคาร) · Split Type (รายเครื่อง) · VRV/VRF (multi-indoor) · ข้อมูลที่กรอกแยกกันคนละแท็บ</div>
<div class="frame"><iframe id="fr" src="Tool_AirCon_Audit.html" title="Air Conditioning Suite"></iframe></div>
<script>
document.getElementById('segs').addEventListener('click',function(e){var b=e.target.closest('.seg');if(!b)return;
  [].forEach.call(this.children,function(x){x.classList.toggle('on',x===b);});
  document.getElementById('fr').src=b.getAttribute('data-src');});
</script>
