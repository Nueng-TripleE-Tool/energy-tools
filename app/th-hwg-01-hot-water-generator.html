<style>

*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55}
header{background:var(--header-grad);color:#fff;padding:10px 16px 10px}

.hd .sub{font-size:12.5px;opacity:.9}
.code{font:600 11.5px 'IBM Plex Mono',monospace;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:999px;margin-right:6px}
.hbtn{font:inherit;font-size:13px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.45);padding:6px 12px;border-radius:8px;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.28)}

.te-tierbar button{font:inherit;padding:2px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;cursor:pointer}
.te-tierbar button.on{background:#fff;color:var(--navy);font-weight:600}
.te-langsw button{font:inherit;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;cursor:pointer;margin-left:4px}
.te-langsw button.on{background:#fff;color:var(--navy);font-weight:700}
.kbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 14px rgba(15,42,74,.06)}
.kbar .in{max-width:1240px;margin:0 auto;padding:8px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.k{padding:2px 10px;border-left:4px solid var(--accent)}
.k .l{font-size:12px;color:var(--muted)}.k .v{font:700 26px/1.1 'Barlow Condensed',sans-serif;color:var(--navy)}.k .u{font-size:12px;color:var(--muted);margin-left:3px}
.k.loss{border-left-color:var(--danger)}.k.money{border-left-color:var(--warn)}
@media (max-width:700px){.kbar{position:static}.kbar .in{grid-template-columns:1fr 1fr}.k .v{font-size:22px}}
main{max-width:1240px;margin:0 auto;padding:14px 16px 30px}
.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:14px;align-items:start}
@media (max-width:1050px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.card h2{font:600 19px 'Barlow Condensed',sans-serif;color:var(--navy);margin:0 0 8px;letter-spacing:.02em}
label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 2px}
input,select{font:inherit;width:100%;padding:7px 9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}
input:focus,select:focus{outline:2px solid rgba(18,164,164,.35);border-color:var(--teal)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 12px}
@media (max-width:620px){.g3{grid-template-columns:1fr 1fr}}
.hint{font-size:11.5px;color:var(--muted);margin-top:2px}
.te-row{display:flex;gap:8px}.te-grow{flex:1}
.te-src{width:auto!important;font-size:11.5px;margin-top:2px;padding:2px 4px;border-radius:6px;color:var(--muted)}
.te-fuel-res{list-style:none;margin:4px 0;padding:0;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.te-fuel-res:empty{border:none}
.te-fuel-res li{padding:5px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:13px;border-bottom:1px solid #f0f4f8}
.te-fuel-res li:hover{background:#f0fafa}.te-fuel-res li.on{background:#e2f5f5}
.te-grade{font:600 10.5px 'IBM Plex Mono',monospace;border-radius:999px;padding:1px 7px;background:#eef3f8;color:var(--muted)}
.te-grade.gA{background:#e3f6ec;color:var(--ok)}.te-grade.gB{background:#fdf3e2;color:var(--warn)}
.te-fuel-card{background:#f7fafc;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:8px}
.te-chips span{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11.5px;padding:1px 8px;margin:3px 4px 0 0}
.te-warn{color:var(--danger);font-size:12.5px}.te-muted{color:var(--muted);font-size:12.5px}.te-small{font-size:11.5px}
.te-tbl{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px}
.te-tbl td,.te-tbl th{border:1px solid var(--line);padding:5px 8px;text-align:left}.te-tbl th{background:#f0f5fa}.te-tbl .r,td.r,th.r{text-align:right}
.te-tbl tr.hl td{background:#e7f6f6;font-weight:600}
.te-qc-sum span{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;margin-right:6px}
.te-qc-sum .ok{background:#e3f6ec;color:var(--ok)}.te-qc-sum .wa{background:#fdf3e2;color:var(--warn)}.te-qc-sum .fa{background:#fde5e8;color:var(--danger)}
tr.qc-fail td{background:#fdf0f2}tr.qc-warn td{background:#fdf8ee}
.te-grid2{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.te-req{color:var(--danger)}.te-btn-sm{font:inherit;font-size:12px;border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:3px 9px;cursor:pointer;margin-top:4px}
.tbtn{font:inherit;font-size:13px;border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--ink)}
.tbtn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.big{font:700 24px 'Barlow Condensed',sans-serif;color:var(--navy)}
.formula{font-size:11.5px;color:var(--muted);background:#f7fafc;border-radius:8px;padding:6px 10px;margin-top:6px}
[hidden]{display:none!important}
.lossbar{display:flex;height:22px;border-radius:7px;overflow:hidden;margin:6px 0;font-size:10.5px;color:#fff}
.lossbar>div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
.lb-eff{background:var(--ok)}.lb-l1{background:#d1702b}.lb-l2{background:#2b7bd1}.lb-l3{background:#8a56c9}.lb-rad{background:#9aa8b6}.lb-uc{background:#c2452b}

<header>

  <div id="tierHost"></div>

<div class="kbar"><div class="in" id="kpi"></div></div>
<main>
<div class="layout">

  <div class="card"><h2><span data-s="s1"></span></h2>
    <div id="fuelHost"></div>
    <div class="g3">
      <div><label><span data-s="F"></span></label><input type="number" id="F" min="0" step="any" data-src="measured"><div class="hint" data-s="hF"></div></div>
      <div><label><span data-s="hrs"></span></label><input type="number" id="hrs" min="0" max="8760" step="1" value="8000"></div>
      <div><label><span data-s="price"></span></label><input type="number" id="price" min="0" step="any"><div class="hint" id="priceGJ"></div></div>
    </div>
  </div>
  <div class="card"><h2><span data-s="s2"></span></h2>
    <div class="g3">
      <div><label>O₂ <span data-s="inFlue"></span> (%)</label><input type="number" id="O2" min="0" max="20.8" step="0.1" data-src="measured"></div>
      <div><label>CO (ppm)</label><input type="number" id="CO_ppm" min="0" step="1" value="0" data-src="measured"></div>
      <div><label>T<sub>g</sub> <span data-s="stack"></span> (°C)</label><input type="number" id="Tg" min="0" step="1" data-src="measured"></div>
      <div><label>T<sub>a</sub> <span data-s="amb"></span> (°C)</label><input type="number" id="Ta" min="-10" max="60" step="0.5" value="32" data-src="measured"></div>
      <div><label>RH (%) <span class="hint" style="display:inline" data-s="opt"></span></label><input type="number" id="RH" min="0" max="100" step="1" data-src="measured"></div>
      <div><label><span data-s="Lrad"></span> (%)</label><input type="number" id="Lrad" min="0" max="10" step="0.1" value="1" data-src="reference"></div>
      <div id="crWrap"><label><span data-s="cRefuse"></span> (%)</label><input type="number" id="cRefuse" min="0" max="60" step="0.5" data-src="measured"><div class="hint" data-s="hCr"></div></div>
    </div>
  </div>
  <div class="card"><h2><span data-s="s3"></span></h2>
    <!--DUTY_BLOCK-->
  </div>
  <div class="card" data-te-feature="calc.whatIf"><h2><span data-s="s4"></span></h2>
    <div class="g3">
      <div><label>O₂ <span data-s="target"></span> (%)</label><input type="number" id="O2t" min="0" max="20.8" step="0.1"></div>
      <div><label>T<sub>g</sub> <span data-s="target"></span> (°C)</label><input type="number" id="Tgt" min="0" step="1"></div>
      <div><label><span data-s="inv"></span> (฿)</label><input type="number" id="inv" min="0" step="any"></div>
    </div>
    <div id="wi"></div>
    <div class="btns"><button class="tbtn pri" id="bEcmFile" data-te-feature="calc.ecm">⬇ <span data-s="ecmBtn"></span></button></div>
  </div>
  <div class="card" data-te-feature="issuer.required"><h2><span data-s="s6"></span></h2><div id="issuerHost"></div></div>
</div>
<div><!-- ขวา -->
  <div class="card"><h2><span data-s="s5"></span></h2><div id="res"></div></div>
  <div class="card"><h2><span data-s="qcT"></span></h2><div id="qc" class="te-muted" data-s="qcEmpty"></div></div>
</div>
</div>
</main>
<input type="file" id="fOpen" accept=".json,application/json" hidden>

var _res=null,_after=null;
/* ── คำนวณ (เรียก te-core เท่านั้น) ── */
function dutyQ(){ // kJ/h ความร้อนใช้ประโยชน์
  if(DUTY==='oil'){
    var o;
    if($('oilType').value==='custom'){o=TE.FLUID.oil('mineral',{cp:[V('cpA'),V('cpB')],rho:[V('rhoA'),V('rhoB')],name:'custom'});}
    else o=TE.FLUID.oil($('oilType').value);
    var m=V('flow');
    if($('flowMode').value==='v'){m=TE.FLUID.massFromVol(o,V('flow'),isFinite(V('Tmeas'))?V('Tmeas'):V('Tin'));}
    return {Q:TE.FLUID.qOil(o,m,V('Tin'),V('Tout')),m:m};
  }
  var P=(isFinite(V('Pg'))?V('Pg'):0)+TE.UNITS.P_ATM;
  var vf=TE.STEAM.vLiq(P,V('Tin'));                 // m³/kg ที่ขาเข้า (จุดวัดการไหลทั่วไป)
  var m2=isFinite(vf)&&vf>0?V('flow')/vf:NaN;       // kg/h
  return {Q:TE.FLUID.qHotWater(m2,P,V('Tin'),V('Tout')),m:m2};
}
function calcSet(f,x){
  var bs=TE.COMB.lossBS845(f,x);
  var as=TE.COMB.lossASME(f,x,{model:'r1',RH:isFinite(V('RH'))?V('RH'):undefined,cRefuse:isFinite(V('cRefuse'))?V('cRefuse'):0});
  return {bs:bs,as:as};
}
function recalc(){
  var f=fuel.get(); if(!f){_res=null;render();return;}
  var x={Tg:V('Tg'),Ta:V('Ta'),O2:V('O2'),CO_ppm:isFinite(V('CO_ppm'))?V('CO_ppm'):0,Lrad:isFinite(V('Lrad'))?V('Lrad'):0};
  var qc=TE.QC.check({Ta:x.Ta,Tg:x.Tg,O2:x.O2,CO_ppm:x.CO_ppm,Lrad:x.Lrad},'boiler',U.sourcesOf(['Ta','Tg','O2','CO_ppm','Lrad']));
  U.qcPanel($('qc'),qc);
  if(!qc.ok){_res={fuel:f,x:x,qc:qc,bad:true};render();return;}
  var m=calcSet(f,x), d=dutyQ(), F=V('F');
  var dir=(d.Q>0&&F>0)?TE.COMB.effDirect(d.Q,F,f.hhv):NaN;
  _res={fuel:f,x:x,bs:m.bs,as:m.as,Q:d.Q,mDuty:d.m,dir:dir,Ein:F>0?F*f.hhv:NaN,qc:qc};
  if(isFinite(V('O2t'))&&isFinite(V('Tgt'))){var x2=Object.assign({},x,{O2:V('O2t'),Tg:V('Tgt')});_after=Object.assign({x:x2},calcSet(f,x2));}
  else _after=null;
  render();
}
function lossBar(bs,as){
  var eff=bs.effHHV,rows=[['lb-eff',eff,'η'],['lb-l1',bs.L1,'L1'],['lb-l2',bs.L2,'L2'],['lb-l3',bs.L3,'L3'],['lb-rad',bs.Lrad,T('Lr')]];
  if(as&&as.valid&&as.Luc>0)rows.push(['lb-uc',as.Luc,'UC']);
  return '<div class="lossbar">'+rows.map(function(r){return '<div class="'+r[0]+'" style="width:'+Math.max(r[1],0)+'%" title="'+r[2]+' '+fx(r[1],2)+'%">'+(r[1]>6?r[2]+' '+fx(r[1],1)+'%':'')+'</div>';}).join('')+'</div>';
}
function render(){
  var r=_res;
  /* KPI */
  var hrs=V('hrs')||0,price=V('price')||0,F=V('F');
  var fuelTHB=(F>0&&hrs&&price)?F*hrs*price:NaN;
  var lossTHB=(r&&!r.bad&&isFinite(fuelTHB))?fuelTHB*(1-r.bs.effHHV/100):NaN;
  $('priceGJ').textContent=(r&&r.fuel&&price>0)?('≈ '+fx(price/r.fuel.hhv*1000,0)+' ฿/GJ (GCV)'):'';
  function kv(cls,l,v,u,d){return '<div class="k '+cls+'"><div class="l">'+l+'</div><span class="v">'+fx(v,d==null?2:d)+'</span><span class="u">'+u+'</span></div>';}
  $('kpi').innerHTML=(r&&!r.bad)?(
    kv('',T('etaInd'),r.bs.effHHV,'%')+
    kv('',T('etaDir'),r.dir,'%')+
    kv('loss',T('lossT'),100-r.bs.effHHV,'%')+
    kv('money',T('lossMoney'),lossTHB/1e6,U.lang.current==='en'?'M THB/yr':'ล้าน฿/ปี')+
    kv('',T('qDuty'),r.Q/3600,'kW',0)
  ):'<div class="te-muted" style="padding:8px 0">'+T('noFuel')+'</div>';

  if(!r){$('res').innerHTML='<div class="te-muted">'+T('noFuel')+'</div>';return;}
  if(r.bad){$('res').innerHTML='<div class="te-warn">'+T('needQc')+'</div>';return;}
  var as=r.as,asRow=as&&as.valid?'<tr><td>'+T('etaAsme')+'</td><td class="r">'+fx(as.effHHV,2)+' %</td></tr>':'';
  $('res').innerHTML=lossBar(r.bs,r.as)+
   '<table class="te-tbl">'+
   '<tr class="hl"><td>'+T('etaInd')+'</td><td class="r">'+fx(r.bs.effHHV,2)+' %</td></tr>'+
   '<tr><td>'+T('etaIndL')+'</td><td class="r">'+fx(r.bs.effLHV,2)+' %</td></tr>'+asRow+
   '<tr class="hl"><td>'+T('etaDir')+'</td><td class="r">'+fx(r.dir,2)+' %</td></tr>'+
   '<tr><td>'+T('L1')+'</td><td class="r">'+fx(r.bs.L1,2)+' %</td></tr>'+
   '<tr><td>'+T('L2')+'</td><td class="r">'+fx(r.bs.L2,2)+' %</td></tr>'+
   '<tr><td>'+T('L3')+'</td><td class="r">'+fx(r.bs.L3,3)+' %</td></tr>'+
   '<tr><td>'+T('Lr')+'</td><td class="r">'+fx(r.bs.Lrad,2)+' %</td></tr>'+
   (as&&as.valid&&as.Luc>0?'<tr><td>'+T('Luc')+'</td><td class="r">'+fx(as.Luc,2)+' %</td></tr>':'')+
   '<tr><td>'+T('qDuty')+'</td><td class="r">'+fx(r.Q/3600,0)+' kW · '+fx(r.Q/1e6,2)+' GJ/h</td></tr>'+
   '<tr><td>'+T('ein')+'</td><td class="r">'+fx(r.Ein/1e3,2)+' GJ/h</td></tr>'+
   '</table>';
  renderWi();
}
function wiCalc(){
  var r=_res;if(!r||r.bad||!_after)return null;
  var e0=r.bs.effHHV,e1=_after.bs.effHHV;if(!(e1>e0))return {e0:e0,e1:e1,sav:0};
  var sav=(1-e0/e1)*100,F=V('F'),hrs=V('hrs')||0,price=V('price')||0;
  var kg=F>0?F*sav/100:NaN,thb=kg*hrs*price,gj=F>0?F*sav/100*hrs*r.fuel.hhv/1000:NaN;
  return {e0:e0,e1:e1,sav:sav,kg:kg,thb:thb,gj:gj,pb:TE.ECON.payback(V('inv'),thb)};
}
function renderWi(){
  var w=wiCalc();if(!w){$('wi').innerHTML='';return;}
  $('wi').innerHTML='<table class="te-tbl"><tr><th></th><th class="r">'+T('now')+'</th><th class="r">'+T('after')+'</th></tr>'+

   '<tr class="hl"><td>η BS 845-1 (GCV)</td><td class="r">'+fx(w.e0,2)+' %</td><td class="r">'+fx(w.e1,2)+' %</td></tr></table>'+

   '<div><div class="hint">'+T('value')+'</div><span class="big">'+fx(w.thb/1e6,2)+'</span> '+(U.lang.current==='en'?'M THB/yr':'ล้าน฿/ปี')+'</div>'+

   '<div class="formula">'+T('ecmBasis')+'</div>';
}
