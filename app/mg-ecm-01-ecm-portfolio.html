<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MG-ECM-01 บัญชีมาตรการอนุรักษ์พลังงาน — Triple E Energy Tools Pro</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- การ์ด MG-ECM-01 · v1.0.0-proto (3 พ.ย. 2569) · ก้อน W3 แผนแม่บท TE-Suite ("Treasure Hunt ไทย")
     รวมมาตรการจากการ์ดต้นทาง (ไฟล์ TE_ECM) · ปฏิสัมพันธ์แบบเรียงลำดับตามห่วงโซ่พลังงาน (TE.ECM.applySequential)
     สิทธิประโยชน์: เงินอุดหนุน พพ. / BOI / รายได้คาร์บอน (TE.ECON.incentive) · ESCO/leasing เป็นหมายเหตุการเงินในรายงาน
     สูตรทั้งหมดอยู่ใน te-core r2a เท่านั้น (ธรรมนูญ r2) · สองภาษา th/en (?lang=en) -->
<script src="../lib/te-core.js"></script>
<script src="../lib/te-ui.js"></script>
<style>
:root{--navy:#0f2a4a;--teal:#12a4a4;--header-grad:linear-gradient(135deg,var(--navy),var(--teal));--bg:#f4f7fa;--card:#fff;--ink:#1c2b3a;--muted:#5b6b7b;--line:#e2e8f0;
  --accent:#12a4a4;--warn:#e08a00;--ok:#1e9e5a;--danger:#d1495b;--radius:14px;--shadow:0 6px 20px rgba(15,42,74,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55}
header{background:var(--header-grad);color:#fff;padding:10px 16px 10px}
.hd{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.hd h1{font:700 24px/1.05 'Barlow Condensed',sans-serif;margin:2px 0 0;letter-spacing:.02em}
.hd .sub{font-size:12.5px;opacity:.9}
.code{font:600 11.5px 'IBM Plex Mono',monospace;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:999px;margin-right:6px}
.hbtn{font:inherit;font-size:13px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.45);padding:6px 12px;border-radius:8px;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.28)}
.te-tierbar{max-width:1360px;margin:6px auto 0;font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:#fff}
.te-tierbar button{font:inherit;padding:2px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;cursor:pointer}
.te-tierbar button.on{background:#fff;color:var(--navy);font-weight:600}
.te-langsw button{font:inherit;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;cursor:pointer;margin-left:4px}
.te-langsw button.on{background:#fff;color:var(--navy);font-weight:700}
.kbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 14px rgba(15,42,74,.06)}
.kbar .in{max-width:1360px;margin:0 auto;padding:8px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}
.k{padding:2px 10px;border-left:4px solid var(--accent)}
.k .l{font-size:12px;color:var(--muted)}.k .v{font:700 25px/1.1 'Barlow Condensed',sans-serif;color:var(--navy)}.k .u{font-size:12px;color:var(--muted);margin-left:3px}
.k.money{border-left-color:var(--warn)}.k.inv{border-left-color:var(--danger)}.k.co2{border-left-color:#5b6b7b}
@media (max-width:700px){.kbar{position:static}.kbar .in{grid-template-columns:1fr 1fr}.k .v{font-size:21px}}
main{max-width:1360px;margin:0 auto;padding:14px 16px 30px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.card h2{font:600 19px 'Barlow Condensed',sans-serif;color:var(--navy);margin:0 0 8px;letter-spacing:.02em}
label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 2px}
input,select{font:inherit;padding:7px 9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;width:100%}
input:focus,select:focus{outline:2px solid rgba(18,164,164,.35);border-color:var(--teal)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 12px}
@media (max-width:760px){.g3,.g4{grid-template-columns:1fr 1fr}}
.hint{font-size:11.5px;color:var(--muted);margin-top:2px}
.tbtn{font:inherit;font-size:13px;border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--ink)}
.tbtn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.seg{display:inline-flex;border:1px solid #cbd5e1;border-radius:9px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:none;background:#fff;padding:5px 12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.te-tbl{border-collapse:collapse;width:100%;margin:8px 0;font-size:12.8px}
.te-tbl td,.te-tbl th{border:1px solid var(--line);padding:4px 7px;text-align:left;vertical-align:middle}
.te-tbl th{background:#f0f5fa}.r{text-align:right}
.te-tbl tr.tot td{background:#e7f6f6;font-weight:600}
.te-tbl input{padding:3px 6px;border-radius:6px;font-size:12.5px}
.mini{width:90px!important}.mini2{width:70px!important}
.mv{font:600 11px 'IBM Plex Mono',monospace;background:#eef3f8;border-radius:999px;padding:1px 7px;color:var(--muted)}
.filechip{display:inline-block;background:#eef7f7;border:1px solid var(--teal);border-radius:999px;font-size:12px;padding:2px 10px;margin:3px 4px 0 0}
.te-muted{color:var(--muted);font-size:12.5px}.te-warn{color:var(--danger);font-size:12.5px}.te-small{font-size:11.5px}
.big{font:700 24px 'Barlow Condensed',sans-serif;color:var(--navy)}
.formula{font-size:11.5px;color:var(--muted);background:#f7fafc;border-radius:8px;padding:6px 10px;margin-top:6px}
.te-grid2{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.te-req{color:var(--danger)}.te-btn-sm{font:inherit;font-size:12px;border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:3px 9px;cursor:pointer;margin-top:4px}
.te-row{display:flex;gap:8px}
[hidden]{display:none!important}
.updn button{font-size:11px;padding:0 6px;border:1px solid #cbd5e1;background:#fff;border-radius:5px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div><span class="code">MG-ECM-01</span><span class="code" id="verChip"></span>
      <h1 id="hTitle"></h1><div class="sub" id="hSub"></div></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span id="langHost"></span>
      <button class="hbtn" id="bOpen" data-te-feature="json.load">📂 <span data-s="open"></span></button>
      <button class="hbtn" id="bExport">💾 <span data-s="save"></span></button>
      <button class="hbtn" id="bEcmOut">⬆ <span data-s="ecmOut"></span></button>
      <button class="hbtn" id="bReport">🖨 <span data-s="report"></span></button>
    </div>
  </div>
  <div id="tierHost"></div>
</header>
<div class="kbar"><div class="in" id="kpi"></div></div>
<main>
  <div class="card"><h2><span data-s="s1"></span></h2>
    <div class="g4">
      <div><label><span data-s="elec"></span></label><input type="number" id="pElec" min="0" step="0.01" value="3.8"></div>
      <div><label><span data-s="efKey"></span></label><select id="efKey"></select><div class="hint" id="efInfo"></div></div>
      <div><label><span data-s="rate"></span></label><input type="number" id="rate" min="0" max="30" step="0.5" value="7"></div>
      <div><label><span data-s="life"></span></label><input type="number" id="life" min="1" max="30" step="1" value="10"></div>
    </div>
    <div id="fuelPrices"></div>
  </div>

  <div class="card"><h2><span data-s="s2"></span></h2>
    <div class="btns">
      <button class="tbtn pri" id="bImport">📥 <span data-s="import"></span></button>
      <span class="te-muted" data-s="importHint"></span>
    </div>
    <div id="fileList"></div>
    <input type="file" id="fEcm" accept=".json,application/json" multiple hidden>
    <details style="margin-top:10px"><summary class="te-muted" style="cursor:pointer" id="manSum"></summary>
      <div class="g4" style="margin-top:6px">
        <div style="grid-column:span 2"><label><span data-s="mName"></span></label><input id="mName"></div>
        <div><label><span data-s="mSys"></span></label><select id="mSys"></select></div>
        <div><label><span data-s="mCarrier"></span></label><select id="mCarrier"><option value="electricity">⚡</option><option value="fuel">🔥</option></select></div>
        <div><label><span data-s="mQty"></span></label><input type="number" id="mQty" min="0" step="any"></div>
        <div><label><span data-s="mUnit"></span></label><select id="mUnit"><option>kWh</option><option>GJ</option></select></div>
        <div><label><span data-s="mFuelName"></span></label><input id="mFuelName"></div>
        <div><label><span data-s="mCapex"></span></label><input type="number" id="mCapex" min="0" step="any"></div>
      </div>
      <button class="tbtn" id="bAddMan" style="margin-top:6px">+ <span data-s="mAdd"></span></button>
      <div class="hint" data-s="mHint"></div>
    </details>
  </div>

  <div class="card"><h2><span data-s="s3"></span></h2>
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center">
      <div class="seg" id="modeSeg"><button data-m="seq" class="on" data-s="mSeq"></button><button data-m="alone" data-s="mAlone"></button></div>
      <span class="te-muted te-small" data-s="seqNote"></span>
    </div>
    <div id="mtbl"></div>
    <div id="chart"></div>
  </div>

  <div class="card" data-te-feature="calc.ecm"><h2><span data-s="s4"></span></h2>
    <div class="g4">
      <div><label><span data-s="grant"></span></label><input type="number" id="grantPct" min="0" max="100" step="1" value="0"></div>
      <div><label><span data-s="tax"></span></label><input type="number" id="taxPct" min="0" max="100" step="1" value="0"></div>
      <div><label><span data-s="taxYrs"></span></label><input type="number" id="taxYears" min="1" max="10" step="1" value="1"></div>
      <div><label><span data-s="carbon"></span></label><input type="number" id="carbonTHB" min="0" step="10" value="0"></div>
    </div>
    <label><span data-s="esco"></span></label><input id="escoNote" placeholder="">
    <div id="inc"></div>
  </div>

  <div class="card" data-te-feature="issuer.required"><h2><span data-s="s5"></span></h2><div id="issuerHost"></div></div>
</main>
<input type="file" id="fOpen" accept=".json,application/json" hidden>
<script>
var U=TE_UI,$=U.$,fx=U.fx,esc=U.esc;
var CODE='MG-ECM-01',VER='1.1.0-proto'; // v1.1: กราฟ payback + เพิ่มมาตรการเอง (3 พ.ย. 2569)
var S={
 title:{th:'บัญชีมาตรการอนุรักษ์พลังงาน (ECM Portfolio)',en:'ECM Portfolio'},
 sub:{th:'รวมมาตรการจากทุกการ์ด · คิดตามห่วงโซ่พลังงาน · สิทธิประโยชน์ · te-core r2a',en:'Collects measures from all cards · energy-chain interaction · incentives · te-core r2a'},
 open:{th:'เปิดไฟล์งาน',en:'Open'},save:{th:'บันทึก JSON',en:'Save JSON'},ecmOut:{th:'ส่งออก TE_ECM รวม',en:'Export merged TE_ECM'},report:{th:'รายงาน',en:'Report'},
 s1:{th:'1. ราคาพลังงานและค่าการปล่อย',en:'1. Energy Prices & Emission Factors'},
 s2:{th:'2. นำเข้ามาตรการจากการ์ดต้นทาง',en:'2. Import Measures from Source Cards'},
 s3:{th:'3. ตารางมาตรการ',en:'3. Measures Table'},
 s4:{th:'4. สิทธิประโยชน์และการเงิน',en:'4. Incentives & Financing'},
 s5:{th:'ข้อมูลผู้จัดทำรายงาน',en:'Report Issuer'},
 elec:{th:'ค่าไฟฟ้าเฉลี่ย (฿/kWh)',en:'Electricity price (THB/kWh)'},
 efKey:{th:'EF ไฟฟ้ากริดไทย (TGO)',en:'Thai grid EF (TGO)'},
 rate:{th:'อัตราคิดลด (%)',en:'Discount rate (%)'},life:{th:'อายุวิเคราะห์ (ปี)',en:'Analysis period (yr)'},
 fuelP:{th:'ราคาเชื้อเพลิง (฿/GJ)',en:'Fuel price (THB/GJ)'},fuelEF:{th:'EF เชื้อเพลิง (kgCO₂e/GJ) — ไม่กรอก = ไม่คิด',en:'Fuel EF (kgCO2e/GJ) — blank = excluded'},
 import:{th:'เลือกไฟล์ TE_ECM (เลือกได้หลายไฟล์)',en:'Choose TE_ECM files (multiple allowed)'},
 importHint:{th:'ไฟล์จากปุ่ม "ส่งมาตรการเข้า ECM Portfolio" ของการ์ดต้นทาง เช่น TH-BLR-01, TH-CAS',en:'Files from each source card\'s "Export measure to ECM Portfolio" button, e.g. TH-BLR-01, TH-CAS'},
 mSeq:{th:'ตามห่วงโซ่พลังงาน',en:'Energy-chain'},mAlone:{th:'คิดเดี่ยว',en:'Stand-alone'},
 seqNote:{th:'ลำดับมาตรการมีผลต่อการคิดตามห่วงโซ่ — ใช้ปุ่ม ↑↓',en:'Order matters in energy-chain mode — use ↑↓'},
 grant:{th:'เงินอุดหนุน พพ. (% ของเงินลงทุน)',en:'DEDE subsidy (% of capex)'},
 tax:{th:'สิทธิ์หักภาษี BOI (% ของเงินลงทุน)',en:'BOI tax benefit (% of capex)'},
 taxYrs:{th:'ทยอยหักภาษี (ปี)',en:'Tax benefit period (yr)'},
 carbon:{th:'รายได้คาร์บอน (฿/tCO₂e)',en:'Carbon revenue (THB/tCO2e)'},
 esco:{th:'หมายเหตุการเงิน ESCO / Leasing (แสดงในรายงาน)',en:'ESCO / leasing financing note (shown in report)'},
 c_ord:{th:'ลำดับ',en:'#'},c_name:{th:'มาตรการ',en:'Measure'},c_sys:{th:'ระบบ',en:'System'},
 c_kwh:{th:'ไฟฟ้า (kWh/ปี)',en:'Electricity (kWh/yr)'},c_gj:{th:'เชื้อเพลิง (GJ/ปี)',en:'Fuel (GJ/yr)'},
 c_thb:{th:'฿/ปี',en:'THB/yr'},c_capex:{th:'ลงทุน (฿)',en:'Capex (THB)'},c_pb:{th:'คืนทุน (ปี)',en:'Payback (yr)'},
 c_grp:{th:'กลุ่ม',en:'Group'},c_co2:{th:'tCO₂e/ปี',en:'tCO2e/yr'},c_del:{th:'ลบ',en:'Del'},
 g_done:{th:'ทำแล้ว',en:'Done'},g_measured:{th:'จากผลตรวจวัด',en:'Measured'},g_estimate:{th:'ประมาณการ',en:'Estimate'},
 kSave:{th:'ผลประหยัดรวม',en:'Total saving'},kInv:{th:'เงินลงทุนรวม',en:'Total capex'},kPb:{th:'คืนทุนรวม',en:'Overall payback'},
 kElec:{th:'ไฟฟ้า',en:'Electricity'},kFuel:{th:'เชื้อเพลิง',en:'Fuel'},kCo2:{th:'ลดก๊าซเรือนกระจก',en:'GHG reduction'},
 empty:{th:'ยังไม่มีมาตรการ — นำเข้าไฟล์ TE_ECM จากการ์ดต้นทาง',en:'No measures yet — import TE_ECM files from source cards'},
 badFile:{th:'ไฟล์ไม่ผ่านการตรวจ: ',en:'File failed validation: '},
 incT:{th:'ผลการเงินของทั้งแผน (ก่อน/หลังสิทธิประโยชน์)',en:'Portfolio financials (before / after incentives)'},
 base:{th:'ก่อนสิทธิประโยชน์',en:'Before incentives'},withI:{th:'หลังสิทธิประโยชน์',en:'After incentives'},
 pb:{th:'คืนทุน (ปี)',en:'Payback (yr)'},npv:{th:'NPV (฿)',en:'NPV (THB)'},irr:{th:'IRR (%)',en:'IRR (%)'},
 needIssuer:{th:'กรอกข้อมูลผู้จัดทำ (ช่อง *) ให้ครบก่อนออกรายงาน: ',en:'Complete required issuer fields first: '},
 yr:{th:'ปี',en:'yr'},total:{th:'รวม',en:'Total'},
 mManual:{th:'➕ หรือเพิ่มมาตรการเองโดยไม่ต้องมีไฟล์',en:'➕ Or add a measure manually (no file needed)'},
 mName:{th:'ชื่อมาตรการ',en:'Measure name'},mSys:{th:'ระบบ',en:'System'},mCarrier:{th:'พลังงาน',en:'Carrier'},
 mQty:{th:'ผลประหยัดต่อปี',en:'Annual saving'},mUnit:{th:'หน่วย',en:'Unit'},mFuelName:{th:'ชื่อเชื้อเพลิง (ถ้า 🔥)',en:'Fuel name (if 🔥)'},
 mCapex:{th:'เงินลงทุน (฿)',en:'Capex (THB)'},mAdd:{th:'เพิ่มมาตรการ',en:'Add measure'},
 mHint:{th:'มาตรการที่เพิ่มเองติดกลุ่ม "ประมาณการ" — ระบุที่มาของตัวเลขในรายงานด้วย',en:'Manually added measures are tagged "Estimate" — state the source of figures in the report'},
 chT:{th:'ผลประหยัดและคืนทุนรายมาตรการ',en:'Saving & payback by measure'},
 repT1:{th:'1. สมมุติฐานราคาพลังงาน',en:'1. Price Assumptions'},
 repT2:{th:'2. ตารางมาตรการอนุรักษ์พลังงาน',en:'2. Energy Conservation Measures'},
 repT3:{th:'3. สรุปการเงินและสิทธิประโยชน์',en:'3. Financial Summary & Incentives'},
 modeLbl:{th:'วิธีคิดผลประหยัด',en:'Saving calculation mode'}
};
function T(k){var e=S[k];return e?(U.lang.current==='en'?e.en:e.th):k;}
document.querySelectorAll('[data-s]').forEach(function(n){n.innerHTML=T(n.getAttribute('data-s'));});
$('hTitle').textContent=T('title');$('hSub').textContent=T('sub');$('verChip').textContent='v'+VER;
document.title='MG-ECM-01 '+T('title')+' — Triple E Energy Tools Pro';
U.lang.mountSwitch($('langHost'));U.tier.mountSwitch($('tierHost'));U.issuer.mount($('issuerHost'));
function V(id){var e=$(id);return e?parseFloat(e.value):NaN;}

/* ── สถานะกลาง: ไฟล์ TE_ECM รวม 1 ไฟล์ (pools+measures) ── */
var ECM=TE.ECM.make({tool:CODE,site:''});
var FILES=[],FUELS={},MODE='seq',ESCO='';

/* EF กริดไทยจาก TE.EF ── */
(function(){var ks=TE.EF.list('CFO.S2.electricity');$('efKey').innerHTML=ks.map(function(k){var e=TE.EF.get(k);return '<option value="'+k+'">'+esc(e.key.split('.').pop())+' — '+fx(e.ef,4)+' '+esc(e.unit)+'</option>';}).join('');
  $('efKey').value=TE.EF.DEFAULT.grid;$('efKey').addEventListener('change',render);})();

/* ── นำเข้าไฟล์ ── */
$('bImport').addEventListener('click',function(){$('fEcm').click();});
$('fEcm').addEventListener('change',function(){
  var fl=[].slice.call(this.files);this.value='';
  fl.forEach(function(file){var r=new FileReader();r.onload=function(){
    var obj;try{obj=JSON.parse(r.result);}catch(e){alert(T('badFile')+file.name);return;}
    var v=TE.ECM.validate(obj);if(!v.ok){alert(T('badFile')+file.name+'\n'+v.errors.join('\n'));return;}
    mergeFile(obj,file.name);render();};r.readAsText(file);});
});
function mergeFile(obj,fname){
  (obj.pools||[]).forEach(function(p){if(!ECM.pools.some(function(q){return q.carrier===p.carrier&&q.name===p.name;}))ECM.pools.push(p);});
  var tool=(obj.meta&&obj.meta.tool)||'file';
  obj.measures.forEach(function(m){var mm=Object.assign({},m);
    if(ECM.measures.some(function(x){return x.id===mm.id;}))mm.id=tool+'/'+mm.id;
    mm._from=tool;ECM.measures.push(mm);
    if(mm.carrier==='fuel'&&mm.fuelName&&!(mm.fuelName in FUELS))FUELS[mm.fuelName]={price:'',ef:''};});
  (obj.pools||[]).forEach(function(p){if(p.fuelName&&!(p.fuelName in FUELS))FUELS[p.fuelName]={price:'',ef:''};});
  FILES.push({name:fname,tool:tool,n:obj.measures.length,site:obj.meta&&obj.meta.site||''});
}

/* ── คำนวณแถว (เรียก engine เท่านั้น) ── */
function tariffs(){var f={};for(var k in FUELS)if(FUELS[k].price!=='')f[k]=+FUELS[k].price;
  return {elec:V('pElec')||0,fuels:f,fuelDefault:0};}
function rowsNow(){
  if(!ECM.measures.length)return {rows:[],tot:{kWh:0,GJ:0,THB:0,capex:0,co2:0}};
  var seq=TE.ECM.applySequential(ECM),ta=tariffs(),efk=$('efKey').value;
  var rows=seq.rows.map(function(r){
    var m=ECM.measures.filter(function(x){return x.id===r.id;})[0];
    var p=(MODE==='seq')?r.sequential:r.standalone;
    var thb=(MODE==='alone'&&m.savingTHB!=null)?m.savingTHB:
      (p.electricity_kWh||0)*ta.elec+(p.fuel_GJ||0)*((ta.fuels[p.fuelName]||0));
    var co2=0;
    try{co2+= (p.electricity_kWh?TE.EF.grid(p.electricity_kWh,efk).tCO2e:0);}catch(e){}
    var fe=p.fuelName&&FUELS[p.fuelName]&&FUELS[p.fuelName].ef!==''?+FUELS[p.fuelName].ef:0;
    co2+=(p.fuel_GJ||0)*fe/1000;
    return {m:m,kWh:p.electricity_kWh||0,GJ:p.fuel_GJ||0,fuelName:p.fuelName,thb:thb,co2:co2,
      pb:(m.capex&&thb>0)?TE.ECON.payback(m.capex,thb-(m.omChange||0)):null};});
  var tot={kWh:0,GJ:0,THB:0,capex:0,co2:0};
  rows.forEach(function(r){tot.kWh+=r.kWh;tot.GJ+=r.GJ;tot.THB+=r.thb;tot.capex+=r.m.capex||0;tot.co2+=r.co2;});
  tot.pb=tot.THB>0?TE.ECON.payback(tot.capex,tot.THB):null;
  return {rows:rows,tot:tot};
}

/* ── วาด ── */
function render(){
  /* ราคาเชื้อเพลิงรายชนิด */
  var keys=Object.keys(FUELS);
  $('fuelPrices').innerHTML=keys.length?'<table class="te-tbl"><tr><th>'+T('kFuel')+'</th><th class="r">'+T('fuelP')+'</th><th class="r">'+T('fuelEF')+'</th></tr>'+
    keys.map(function(k){var f=FUELS[k];return '<tr><td>'+esc(k)+'</td><td class="r"><input class="mini r" type="number" step="1" data-fp="'+esc(k)+'" value="'+f.price+'"></td><td class="r"><input class="mini r" type="number" step="0.1" data-fe="'+esc(k)+'" value="'+f.ef+'"></td></tr>';}).join('')+'</table>':'';
  /* รายชื่อไฟล์ */
  $('fileList').innerHTML=FILES.map(function(f){return '<span class="filechip">'+esc(f.tool)+' · '+f.n+' '+(U.lang.current==='en'?'measure(s)':'มาตรการ')+(f.site?' · '+esc(f.site):'')+'</span>';}).join('');
  /* ตารางมาตรการ */
  var R=rowsNow();
  if(!R.rows.length){$('mtbl').innerHTML='<div class="te-muted" style="padding:10px 0">'+T('empty')+'</div>';}
  else{
    $('mtbl').innerHTML='<table class="te-tbl"><tr><th>'+T('c_ord')+'</th><th>'+T('c_name')+'</th><th>'+T('c_sys')+'</th>'+
      '<th class="r">'+T('c_kwh')+'</th><th class="r">'+T('c_gj')+'</th><th class="r">'+T('c_thb')+'</th><th class="r">'+T('c_capex')+'</th><th class="r">'+T('c_pb')+'</th><th class="r">'+T('c_co2')+'</th><th>'+T('c_grp')+'</th><th>'+T('c_del')+'</th></tr>'+
      R.rows.map(function(r,i){var m=r.m;
        return '<tr><td class="updn"><button data-mv="-1" data-i="'+i+'">↑</button><button data-mv="1" data-i="'+i+'">↓</button> '+(i+1)+'</td>'+
        '<td>'+esc(m.name)+' <span class="mv">'+esc(m._from||'')+'</span>'+(m.mvOption?' <span class="mv">M&V '+m.mvOption+'</span>':'')+'</td>'+
        '<td>'+esc(m.system)+'</td>'+
        '<td class="r">'+(r.kWh?fx(r.kWh,0):'–')+'</td><td class="r">'+(r.GJ?fx(r.GJ,1):'–')+'</td>'+
        '<td class="r">'+fx(r.thb,0)+'</td>'+
        '<td class="r"><input class="mini r" type="number" min="0" step="1000" data-cx="'+i+'" value="'+(m.capex!=null?m.capex:'')+'"></td>'+
        '<td class="r">'+(r.pb!=null?fx(r.pb,2):'–')+'</td><td class="r">'+(r.co2?fx(r.co2,1):'–')+'</td>'+
        '<td><select class="mini2" data-gr="'+i+'">'+['done','measured','estimate'].map(function(g){return '<option value="'+g+'"'+((m.group||'estimate')===g?' selected':'')+'>'+T('g_'+g)+'</option>';}).join('')+'</select></td>'+
        '<td><button class="te-btn-sm" data-del="'+i+'">✕</button></td></tr>';}).join('')+
      '<tr class="tot"><td colspan="3">'+T('total')+'</td><td class="r">'+fx(R.tot.kWh,0)+'</td><td class="r">'+fx(R.tot.GJ,1)+'</td><td class="r">'+fx(R.tot.THB,0)+'</td><td class="r">'+fx(R.tot.capex,0)+'</td><td class="r">'+(R.tot.pb!=null?fx(R.tot.pb,2):'–')+'</td><td class="r">'+fx(R.tot.co2,1)+'</td><td colspan="2"></td></tr></table>'+
      '<div class="formula">'+(MODE==='seq'?esc(TE.ECM.applySequential(ECM).note):T('mAlone'))+'</div>';
  }
  /* KPI */
  function kv(cls,l,v,u,d){return '<div class="k '+cls+'"><div class="l">'+l+'</div><span class="v">'+fx(v,d==null?1:d)+'</span><span class="u">'+u+'</span></div>';}
  var M=U.lang.current==='en'?'M THB/yr':'ล้าน฿/ปี';
  $('kpi').innerHTML=kv('money',T('kSave'),R.tot.THB/1e6,M,2)+
    kv('',T('kElec'),R.tot.kWh/1e3,'MWh/'+T('yr'),1)+kv('',T('kFuel'),R.tot.GJ,'GJ/'+T('yr'),0)+
    kv('inv',T('kInv'),R.tot.capex/1e6,U.lang.current==='en'?'M THB':'ล้าน฿',2)+
    kv('',T('kPb'),R.tot.pb,T('yr'),2)+kv('co2',T('kCo2'),R.tot.co2,'tCO₂e/'+T('yr'),1);
  renderInc(R);renderChart(R);
}
function renderInc(R){
  if(!R.rows.length){$('inc').innerHTML='';return;}
  var inc=TE.ECON.incentive({capex:R.tot.capex,saving:R.tot.THB,years:V('life')||10,rate:(V('rate')||7)/100,
    grantPct:V('grantPct')||0,taxPct:V('taxPct')||0,taxYears:V('taxYears')||1,carbonTHB:V('carbonTHB')||0,tCO2e:R.tot.co2});
  function row(l,a,b,d){return '<tr><td>'+l+'</td><td class="r">'+fx(a,d)+'</td><td class="r">'+fx(b,d)+'</td></tr>';}
  $('inc').innerHTML='<h2 style="font-size:15px;margin-top:10px">'+T('incT')+'</h2><table class="te-tbl"><tr><th></th><th class="r">'+T('base')+'</th><th class="r">'+T('withI')+'</th></tr>'+
    row(T('pb'),inc.base.payback,inc.withIncentive.payback,2)+
    row(T('npv'),inc.base.npv,inc.withIncentive.npv,0)+
    row(T('irr'),inc.base.irr*100,inc.withIncentive.irr*100,1)+'</table>'+
    '<div class="hint">'+(U.lang.current==='en'?'Subsidy ':'เงินอุดหนุน ')+fx(inc.grant,0)+' ฿ · '+(U.lang.current==='en'?'tax benefit ':'สิทธิ์ภาษี ')+fx(inc.taxTotal,0)+' ฿ · '+(U.lang.current==='en'?'carbon revenue ':'รายได้คาร์บอน ')+fx(inc.carbonTHByr,0)+' ฿/'+T('yr')+(ESCO?' · ESCO/Leasing: '+esc(ESCO):'')+'</div>';
}
/* ── กราฟแท่งผลประหยัด/คืนทุน (SVG — ชั้นแสดงผล ไม่ใช่สูตร) ── */
function renderChart(R){
  var host=$('chart');if(!R.rows.length){host.innerHTML='';return;}
  var rows=R.rows.slice(0,12),W=980,bh=26,gap=10,lw=260,maxT=Math.max.apply(null,rows.map(function(r){return r.thb;}))||1;
  var H=rows.length*(bh+gap)+46;
  var sv='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:'+W+'px;font-family:inherit">';
  sv+='<text x="0" y="14" font-size="13" font-weight="600" fill="#0f2a4a">'+esc(T('chT'))+'</text>';
  rows.forEach(function(r,i){var y=30+i*(bh+gap),w=Math.max(2,(W-lw-120)*r.thb/maxT);
    sv+='<text x="'+(lw-8)+'" y="'+(y+bh*0.68)+'" font-size="11.5" text-anchor="end" fill="#1c2b3a">'+esc(r.m.name.slice(0,34))+'</text>';
    sv+='<rect x="'+lw+'" y="'+y+'" width="'+w+'" height="'+bh+'" rx="5" fill="'+(r.m.group==='done'?'#1e9e5a':r.m.group==='measured'?'#12a4a4':'#e0a400')+'"/>';
    sv+='<text x="'+(lw+w+6)+'" y="'+(y+bh*0.68)+'" font-size="11.5" fill="#5b6b7b">'+fx(r.thb/1e6,2)+' M฿'+(r.pb!=null?' · PB '+fx(r.pb,1)+' '+T('yr'):'')+'</text>';});
  sv+='</svg>';host.innerHTML=sv;
}
/* ── เพิ่มมาตรการเอง ── */
$('manSum').textContent=T('mManual');
$('mSys').innerHTML=TE.ECM.SYSTEMS.map(function(s){return '<option>'+s+'</option>';}).join('');
$('bAddMan').addEventListener('click',function(){
  var carrier=$('mCarrier').value;
  var m={id:'man-'+Date.now().toString(36),name:$('mName').value.trim(),system:$('mSys').value,
    effect:'direct',carrier:carrier,unit:carrier==='electricity'?'kWh':$('mUnit').value,
    savingQty:parseFloat($('mQty').value),group:'estimate',_from:'manual'};
  if(carrier==='fuel'&&$('mFuelName').value.trim())m.fuelName=$('mFuelName').value.trim();
  var cap=parseFloat($('mCapex').value);if(cap>0)m.capex=cap;
  var v=TE.ECM.checkMeasure(m);if(!v.ok){alert(v.errors.join('\n'));return;}
  ECM.measures.push(m);
  if(m.fuelName&&!(m.fuelName in FUELS))FUELS[m.fuelName]={price:'',ef:''};

});
/* ── โต้ตอบตาราง ── */
$('mtbl').addEventListener('click',function(e){
  var mv=e.target.getAttribute('data-mv');if(mv!=null){var i=+e.target.getAttribute('data-i'),j=i+(+mv);
    if(j>=0&&j<ECM.measures.length){var a=ECM.measures;var t=a[i];a[i]=a[j];a[j]=t;render();}return;}
  var del=e.target.getAttribute('data-del');if(del!=null){ECM.measures.splice(+del,1);render();}});
$('mtbl').addEventListener('input',function(e){
  var cx=e.target.getAttribute('data-cx');if(cx!=null){var v=parseFloat(e.target.value);if(v>0)ECM.measures[+cx].capex=v;else delete ECM.measures[+cx].capex;render();}
});
$('mtbl').addEventListener('change',function(e){
  var gr=e.target.getAttribute('data-gr');if(gr!=null){ECM.measures[+gr].group=e.target.value;render();}});
$('fuelPrices').addEventListener('input',function(e){
  var k=e.target.getAttribute('data-fp');if(k!=null)FUELS[k].price=e.target.value;
  var k2=e.target.getAttribute('data-fe');if(k2!=null)FUELS[k2].ef=e.target.value;render();});
$('modeSeg').addEventListener('click',function(e){var m=e.target.getAttribute('data-m');if(!m)return;MODE=m;
  [].forEach.call(this.children,function(b){b.classList.toggle('on',b.getAttribute('data-m')===m);});render();});
['pElec','rate','life','grantPct','taxPct','taxYears','carbonTHB'].forEach(function(id){$(id).addEventListener('input',render);});
$('escoNote').addEventListener('input',function(){ESCO=this.value;render();});

$('bEcmOut').addEventListener('click',function(){
  if(!ECM.measures.length){alert(T('empty'));return;}
  ECM.meta.exportedAt=new Date().toISOString();ECM.meta.site=U.issuer.data.clientName||ECM.meta.site;

    inputs:{prices:{elec:$('pElec').value,fuels:FUELS,efKey:$('efKey').value,rate:$('rate').value,life:$('life').value,
      grantPct:$('grantPct').value,taxPct:$('taxPct').value,taxYears:$('taxYears').value,carbonTHB:$('carbonTHB').value,esco:ESCO,mode:MODE},

    results:{THB:R.tot.THB,kWh:R.tot.kWh,GJ:R.tot.GJ,capex:R.tot.capex,tCO2e:R.tot.co2}});});

$('fOpen').addEventListener('change',function(){if(!this.files[0])return;U.json.open(this.files[0],function(res){

  if(i.prices){$('pElec').value=i.prices.elec||'';if(i.prices.efKey)$('efKey').value=i.prices.efKey;

    '<tr><td colspan="2"><b>'+T('total')+'</b></td><td class="r"><b>'+fx(R.tot.kWh,0)+'</b></td><td class="r"><b>'+fx(R.tot.GJ,1)+'</b></td><td class="r"><b>'+fx(R.tot.THB,0)+'</b></td><td class="r"><b>'+fx(R.tot.capex,0)+'</b></td><td class="r"><b>'+(R.tot.pb!=null?fx(R.tot.pb,2):'–')+'</b></td><td class="r"><b>'+fx(R.tot.co2,1)+'</b></td></tr></table>';
  var inc=TE.ECON.incentive({capex:R.tot.capex,saving:R.tot.THB,years:V('life')||10,rate:(V('rate')||7)/100,
    grantPct:V('grantPct')||0,taxPct:V('taxPct')||0,taxYears:V('taxYears')||1,carbonTHB:V('carbonTHB')||0,tCO2e:R.tot.co2});
  body+='<h2>'+T('repT3')+'</h2><table><tr><th></th><th class="r">'+T('base')+'</th><th class="r">'+T('withI')+'</th></tr>'+
    '<tr><td>'+T('pb')+'</td><td class="r">'+fx(inc.base.payback,2)+'</td><td class="r">'+fx(inc.withIncentive.payback,2)+'</td></tr>'+
    '<tr><td>'+T('npv')+'</td><td class="r">'+fx(inc.base.npv,0)+'</td><td class="r">'+fx(inc.withIncentive.npv,0)+'</td></tr>'+
    '<tr><td>'+T('irr')+'</td><td class="r">'+fx(inc.base.irr*100,1)+'</td><td class="r">'+fx(inc.withIncentive.irr*100,1)+'</td></tr></table>'+
    (ESCO?'<p>ESCO/Leasing: '+esc(ESCO)+'</p>':'')+
    '<p style="font-size:10.5px;color:#5b6b7b">'+(en?'EF: ':'ค่า EF: ')+esc($('efKey').value)+'</p>';
  var rep=U.report.build({card:CODE,title:CODE+' — '+T('title'),bodyHtml:body,keyNums:[R.tot.THB,R.tot.capex,R.tot.co2]});
  var fmt=(U.tier.current==='expert'&&confirm(en?'OK = Word (.doc) · Cancel = PDF/print':'ตกลง = Word (.doc) · ยกเลิก = PDF/พิมพ์'))?'docx':'pdf';
  U.report.output(rep,fmt,CODE+'_'+(U.issuer.data.clientCode||'portfolio'));
});
U.tier.on(function(){render();});
U.tier.set(U.tier.resolve());
render();
